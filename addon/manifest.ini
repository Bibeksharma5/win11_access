name = win11_access
summary = "Accessibility enhancement for windows 11"
description = """Accessibility enhancement for Windows 11.
Features:
- Windows Search (Start Menu): Suppresses repetitive 'context menu list' announcements when navigating search result context menu items with Up/Down arrow keys.
- Windows Settings (Installed Apps): Announces the number of apps found when focusing the drive filter combo box, and announces application size while navigating through the installed applications list.
- Windows Calculator: Automatically announces the active calculation mode (e.g. Standard mode, Scientific mode, Programmer mode) upon opening the Calculator application.
"""
